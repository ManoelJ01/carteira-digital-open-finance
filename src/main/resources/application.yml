server:
  port: 8080

spring:
  application:
    name: carteira-digital

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carteira_digital?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:carteira_user}
    password: ${SPRING_DATASOURCE_PASSWORD:carteira_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ---- Configurações próprias da aplicação ----
app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-with-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  pluggy:
    base-url: ${PLUGGY_BASE_URL:https://api.pluggy.ai}
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    connect-token-webhook-url: ${PLUGGY_WEBHOOK_URL:}

  scheduler:
    sync-cron: ${SYNC_CRON:0 0 */6 * * *} # a cada 6 horas por padrão

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.manoel.carteiradigital: INFO
    org.springframework.web: INFO
    feign: INFO
